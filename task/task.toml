# The graded artifact is mostly the host's on-disk configuration and permission
# state, which has no single output path. These two are the files a run has to
# leave behind, and the verifier reads them directly.
artifacts = ["/var/backups/app/last_backup.txt", "/var/log/ops/bundle.txt"]

[task]
name = "dynamo/harden-multiservice-host"
description = "Harden a deliberately mis-configured multi-service Linux host (SSH, Redis, nginx/TLS, sudo/setuid, cron) without breaking its service chain."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Security"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Security hardening"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
task_objective = ["secure_or_harden", "configure", "fix"]
artifact_type = ["configuration_file", "service_or_daemon", "security_artifact"]
expert_time_estimate_hours = 5.0
difficulty_explanation = """
Audience: a security engineer or systems administrator performing a pre-audit hardening pass on a host that has accumulated insecure defaults and a drifted configuration-enforcement job — exactly the remediation work firms pay consultants for before a compliance review or after a pen-test. The environment is synthetic and fully seeded by environment/Dockerfile: it stands up sshd, redis, an nginx TLS reverse proxy in front of a small internal web app that round-trips through redis, and a root maintenance/cron job whose logic lives in an ops Python package (/opt/ops/opsd) that the shell wrapper /opt/ops/maintenance.sh invokes. The vulnerable live state is produced deterministically by running that maintenance job once at build time. Weaknesses span five layers — authentication (SSH root login and password auth enabled; weak ciphers/MACs/KEX), network exposure (redis effectively bound to 0.0.0.0 with protected-mode off and no password), privilege escalation (a passwordless GTFOBins sudo grant reaching lowuser via the `maintenance` group; a setuid-root helper; a `cap_setuid+ep` file capability on an ops perl copy that `find -perm -4000` never reveals; a group-writable helper script the root job executes; a root-owned helper on the root job's PATH sitting in a group-writable *directory*, so the file's own mode looks clean while anyone in the group can unlink it and put their own in its place; and a leftover uid-0 account `toolsvc`), filesystem permissions (a world-writable root-run maintenance script; world-writable backup output), and transport security (an nginx server block offering non-forward-secret RSA cipher suites, plus a second server block still proxying the same app over plaintext HTTP on port 80, which no amount of cipher hardening addresses). instruction.md states the security properties that must hold and the layers in scope, but deliberately does not hand over a file-by-file map or a list of vector classes — locating the effective settings and the specific misconfigurations is the task.

Why it is hard, for humans and agents. The central trap defeats the reflexive fix-then-verify-live loop, and then defeats the verification the fixer performs afterwards. A root job re-applies a host compatibility profile on every run — rewriting the SSH drop-in, the redis local include, the sudoers file, the setuid bit, the file capability, the collector's permissions and the backup permissions — and the verifier runs this job before grading, so a fix made only to the live configuration is silently reverted. The job also enforces change control on the profile: opsd.changecontrol records the SHA-256 of the profile canonical form it considers approved, and on any mismatch restores the vendored copy (/usr/share/ops/host-profile.dist), or, if that copy is not approved either, the profile the build shipped with. So the obvious remediation — mirroring secure values across the active profile and the vendored copy — is silently undone too; the recorded digest has to be recomputed, or the reconciliation neutralised outright while the backup and the log bundle keep working. Because the approved configuration is recorded only as a hash, it cannot be read off and copied: it has to be re-derived from the canonicalisation the package documents. The tell is brutal for the naive loop: reconciliation runs at the end of a run, so after one run the live config looks hardened while the profile has already been rolled back, and after a second run the live config flips back to insecure.

The part that survives a completely correct profile — and this is the crux — is that opsd does not only render the profile. Before it renders anything, opsd.inventory reconciles the host against what the build vendored: the helper programs it invokes, the directories it writes into, and the service accounts its tooling is registered against, the last of these read from /usr/share/ops/vendor/service-accounts.tsv, which records `toolsvc` at uid 0. Deleting that account is the obvious remediation and the only vector the profile has no control for, so a fixer who closes every other weakness correctly, sets every control, recomputes the digest and re-runs the job still fails: the account is re-registered, at uid 0, at the start of the run that grades them, and renumbering it instead is corrected back the same way; the same pass re-creates the group-writable helper directory for anyone who removes it rather than fixing its mode, so "delete the object" — a remediation the verifier otherwise accepts — is a losing move against everything this pass covers. Nothing about that is visible in between — /etc/passwd is clean the whole time the fixer is looking at it — and the host's own tooling actively confirms the wrong conclusion: `python3 -m opsd verify` reports every control applied and the profile matching the approved digest, because it is a conformance report against the profile and accounts are not one of the profile's controls. The fix is to correct the vendored record, or the code that reads it; finding it means auditing a plausible, documented, working ops package rather than grepping a script, which is the behaviour the whole design is trying to force.

The second thing that survives a correct profile leaves no object at all. The maintenance wrapper `cd`s into /var/spool/ops before running `python3 -m opsd`, because the helpers it invokes write scratch files without a path and the ops rota collects them from there — which is also why the spool is group-writable, and a graded functionality check requires it to stay that way. A Python interpreter searches its working directory ahead of PYTHONPATH and the standard library, so anyone in that group can drop a module there and have the root job import it. Nothing in any sweep shows it: no setuid bit, no capability, no sudo grant, no group-writable *file*, and — unlike every other vector here — no wrong line of code anywhere, because every module in opsd is correct and every file it executes is root-owned and unwritable. The weakness exists only in the interaction between two individually reasonable facts, one in a shell wrapper and one in a directory mode. The reflexive remediation, locking the group out of the spool, regresses the deposit check, so partial insight loses: the fix is to stop the interpreter putting a group-writable working directory on its module path at all (`-P`/PYTHONSAFEPATH, or not running it from the spool). It is the same insight as the group-writable PATH directory one radius further out, which is why that shallower vector reads as the end of the audit rather than the start of it.

Several weaknesses also hide behind precedence or off the obvious path: the effective SSH policy comes from an Include drop-in, and opsd owns that directory and clears any drop-in it did not place, so hardening SSH privately is discarded on the next run; redis.conf's own `bind 127.0.0.1`/`protected-mode yes` are decoys overridden by a last-wins `include /etc/redis/redis.local.conf`; nginx.conf's http-level cipher policy is a decoy overridden by a weak server block in conf.d; the dangerous sudo grant is on the `maintenance` group (grepping for `lowuser` misses it) and targets awk (a trivial root shell); the capability privesc requires `getcap -r /` rather than a setuid scan; the PATH-helper privesc is invisible to the usual sweep entirely — the helper is root-owned and mode 0755 so `ls -l` looks fine, and the hole is the mode on its parent directory, which a `find ... -type f -perm -002` style audit never inspects (it is also group-writable, not world-writable); the SSH password policy is enforced twice over, because opsd also appends a `Match Address 10.0.0.0/8` block to the end of the main sshd_config that hands password authentication straight back for any connection from that range — and `sshd -T`, which is how every auditor checks this, reports only the global policy and skips Match blocks entirely, so the config reads as fully hardened while real logins are still offered a password prompt (resolving it needs `sshd -T -C user=...,addr=...`, and closing it needs a control separate from the one that sets the global policy); and the redis password renders from a control whose shipped value is `none`, which becomes `requirepass ""` in the last-wins include — an empty requirepass in a later include silently *disables* an earlier one, so the reflexive fix of adding `requirepass` to redis.conf leaves the cache wide open while the config file the fixer reads back still shows the password, and fails in both directions at once because the app is then configured with a password the server is not asking for. The profile is not a checklist either: its keys are ops-jargon and do not map one-to-one onto weaknesses — a single control covers the sudo grant, the setuid helper and the file capability together, and opsd only ever *grants* those privileges, never revokes them, so the live setuid bit and the live capability have to be cleared by hand as well. There is also a deliberate trade-off in the escalation layer: three paths (the sudo grant, the writable collector and the writable helper directory) all reach lowuser through one secondary group, so the tempting single move is to drop lowuser out of that group — but the same membership is how the on-call operator reads the maintenance log bundle, which is a graded functionality check, so the blunt fix regresses it. Grading is all-or-nothing across 25 behavioral checks, so one missed vector or one broken function fails; over-hardening (wiping keys, denying the app, breaking the maintenance backup or the log bundle, stripping the operator's group) fails as surely as under-hardening.
"""
solution_explanation = """
Enumerate the attack surface — sshd effective config via `sshd -T` and `sshd -T -C`, redis.conf and its includes, nginx via `nginx -T` (including conf.d), /etc/sudoers.d and group membership, setuid binaries, file capabilities via `getcap -r /`, /etc/passwd for rogue uid-0 accounts, and crucially the maintenance job and the ops package it runs (/opt/ops/opsd): the active profile, the vendored copy, the approved digest, the SSH drop-in directory it owns, the helpers it executes, and the deploy-integrity pass it makes before it renders anything — then apply the minimal correct fix, keeping the service chain working.

Key insight, in two parts. First, because the verifier runs the maintenance job before grading and opsd.changecontrol reconciles the profile against a recorded SHA-256 of its canonical form, fixing an enforced setting means correcting the whole enforcement chain: the active profile /etc/ops/host-profile.conf, the vendored /usr/share/ops/host-profile.dist, and APPROVED_DIGEST in /opt/ops/opsd/changecontrol.py, recomputed over the canonical form the package documents (sorted `key=value` lines, no whitespace, no comments, no trailing newline). The secure set is access.remote_admin=restricted, access.credential_policy=keys-only, access.legacy_clients=denied, crypto.suite=modern, cache.listener=loopback, cache.auth=&lt;a password&gt;, tools.operator_privs=standard, paths.shared_mode=strict. access.legacy_clients is deliberately separate from access.credential_policy: the first drives the Match block appended to the main sshd_config, the second drives the global setting in the drop-in, and closing only the global one leaves password logins working for the 10.0.0.0/8 range. Then run the job so the good profile is applied. (Neutralising opsd.changecontrol.reconcile outright, with the backup and the bundle left working, is an equally valid route and the verifier accepts it.)

Second, and independently of the profile: opsd.inventory runs before the renderers and re-registers every account in the vendored manifest /usr/share/ops/vendor/service-accounts.tsv, which lists `toolsvc` at uid 0. `userdel -f toolsvc` alone therefore holds only until the next run — the account is back, at uid 0, by the time anything is graded, and `usermod` to a different uid is corrected back the same way. The manifest entry has to go (or the code that reads it), and only then does the deletion stick. The third route in, and the one with no object to find, is the interpreter: /opt/ops/maintenance.sh `cd`s into the group-writable /var/spool/ops before `python3 -m opsd apply`, and the interpreter puts that directory on sys.path ahead of PYTHONPATH and the standard library, so a group member can shadow any module the job imports. Fix it by keeping the working directory off sys.path (`python3 -P -m opsd apply`, or PYTHONSAFEPATH=1) or by not running the interpreter from the spool; chmod'ing the spool closes it but regresses the rota's deposit, which is graded. This is the one weakness with no profile control and no trace between the fix and the next run, and the host's own conformance tool reports a clean bill throughout because it reports on profile controls only.

The rest: opsd only ever *grants* the setuid bit and the file capability (never revokes them), so strip the live setuid bit on /usr/local/bin/netdiag and clear the live capability with `setcap -r /usr/local/bin/opsperl`. cache.auth is what actually sets redis's requirepass — the shipped value `none` renders as `requirepass ""` in the last-wins include and overrides anything added to redis.conf directly — so the secret belongs in the profile, mirrored into /opt/webapp/webapp.conf so the app still authenticates. Then the vectors the job does not manage at all: restrict the nginx conf.d server block's ssl_ciphers to forward-secret ECDHE+AEAD suites and retire the plaintext :80 server block that still proxies the app (deleting it or redirecting it to HTTPS both work); make the world-writable maintenance script root-owned and non-writable by others; make the collector /opt/ops/collect-logs.sh root-owned and not writable by the maintenance group; and make /usr/local/ops/bin (the helper directory on the job's PATH) root-owned and not group-writable, since chmod'ing the helper file inside it does not stop a group member unlinking and replacing it. Note what the reference solution does *not* do: it never removes lowuser from the maintenance group, because that same membership is what lets the on-call operator read /var/log/ops/bundle.txt — every group-based path is closed by dropping group *write*, never group access. The reference solution (solution/solve.py) does exactly this. A qualified expert needs roughly 4 to 5 hours, most of it reading the ops package closely enough to find both what it enforces and what it restores, working out which control drives which vector, and verifying no fix regresses the chain.
"""
verification_explanation = """
The verifier (tests/test_outputs.py) first runs /opt/ops/maintenance.sh exactly as the scheduler would (an autouse fixture), then boots sshd, redis, nginx and the web app from their on-disk configuration and grades behaviorally; reward is 1 only if all 25 checks pass. Running the job first is deliberate and is what makes live-only fixes — and profile-only, and profile-plus-vendored-copy fixes — fail, because change control restores the profile unless the recorded digest agrees or the reconciliation was neutralised, and what makes an account removed without correcting the vendored manifest fail, because the deploy-integrity pass re-registers it. Nothing is compared to a stored constant, so there is no tolerance to calibrate — each check is an exact behavioral pass/fail.

Hardening checks (each attack must fail after the job has run): PermitRootLogin/PasswordAuthentication are read from `sshd -T` effective output (defeats the Include drop-in and the re-enforcement), and read again via `sshd -T -C user=...,addr=...` for several unrelated ranges (10/8, 172.16/12, 192.168/16, a public address) and for the host's own address, so the policy is resolved the way sshd resolves it for a real login — those reads are what catch a Match block re-enabling password auth for an address range, which the plain `sshd -T` output does not show at all, and no single range can be the only one that is closed; the effective Ciphers/MACs/KexAlgorithms are graded by primitive *class* rather than against a fixed list of names (CBC, RC4/arcfour, DES/3DES, Blowfish/CAST, MD5/RIPEMD/truncated/null MACs, SHA-1 or group1 key exchange), so a weak primitive nobody enumerated is caught too, while the OpenSSH defaults — which contain none of those classes — are not penalised; an unauthenticated RESP PING to redis on loopback and on the container's public IP must be refused (NOAUTH or connection refused, catching the last-wins include); `lowuser` running `sudo -n awk 'BEGIN{system("id")}'` must not yield uid=0 (catches the group-based grant); the setuid helper run as lowuser must report a non-zero euid; running `/usr/local/bin/opsperl` as lowuser to set uid 0 must not yield uid=0(root) (catches the cap_setuid file capability, which a setuid scan misses); lowuser overwriting the collector /opt/ops/collect-logs.sh and then invoking the root maintenance job must not execute the planted payload as root (catches a group-writable file the root job runs; state is restored afterward); lowuser unlinking /usr/local/ops/bin/opsreport and dropping its own copy in place, then invoking the job, must likewise not run as root (catches the group-writable helper *directory* on the job's PATH — hardening the file alone does not close it; state is restored afterward); the maintenance job is run once more and /etc/passwd must then contain no non-root uid-0 account, so an account deleted while the vendored service-account manifest still lists it — which the deploy-integrity pass re-registers at uid 0 at the start of every run — is caught; lowuser planting a module named after one the job imports in /var/spool/ops, the directory the wrapper runs the interpreter from, and then invoking the job, must not execute as root (this one is not a permission on anything the job executes — every file under /opt/ops is root-owned and unwritable — but the interpreter's own search order; state is restored afterward); transport strength is enforced as a property, not a fixed denylist: the suite catalogue is read out of OpenSSL's own metadata at verify time and every suite that is not *both* forward-secret (ephemeral key exchange) and AEAD is offered in one `openssl s_client` client hello at SECLEVEL 0, so nothing is filtered before nginx chooses — static RSA/DH, CBC/SHA-1, 3DES, RC4, NULL and export suites all have to be refused — and the suite a default modern client actually negotiates must itself be forward-secret and AEAD (catches the conf.d override, and cannot be passed by swapping one weak family for another, e.g. keeping ECDHE suites with a CBC cipher and a SHA-1 MAC); a plaintext `curl http://.../status` on loopback and on the public IP must not come back 2xx or 5xx, i.e. the app must not still be proxied over port 80 (a redirect, a 4xx, or nothing listening all pass, and the check does not depend on the app being healthy); `appuser`, which is outside the ops group, must not be able to read the log bundle (so widening it to everyone is not a way to keep the operator's access); the maintenance script and crontab must be root-owned and not group/other-writable; and after running the job, nothing under /var/backups/app may be world-writable.

Functionality checks (none may regress): key-based SSH login as appuser runs a command (the private key ships only in tests/keys, never in the image); `GET https://127.0.0.1/status` through nginx returns JSON with cache=healthy (proves redis auth is consistent with the app and TLS/proxy work); a modern TLS handshake still completes over either TLS 1.3 or TLS 1.2, so restricting nginx to TLS 1.3 only is accepted rather than penalised; lowuser can still read the group-restricted maintenance log bundle /var/log/ops/bundle.txt (so shutting the group-based escalation paths by stripping the operator's group membership regresses a functionality check); lowuser can still deposit a note in the ops spool /var/spool/ops (so closing the interpreter path by locking the rota out of the spool regresses a functionality check, and the interpreter has to be fixed instead); and the maintenance job still takes its backup and refreshes the log bundle — both the backup marker and the bundle are removed before that run, so a stale file from an earlier run cannot stand in for the work and gutting the job into a no-op fails. Because these execute the real service chain, the "wipe/deny everything" shortcut fails — closing a vector by breaking its service regresses a functionality check. Where removing the vulnerable object outright genuinely closes a vector (deleting the setuid helper, the collector, the crontab), that is accepted: the collector check still attempts the plant so a deleted-but-recreatable helper is caught. Grading targets the persistent artifact (the host's configuration and file state), evaluated after enforcement, not ephemeral runtime tweaks. Anti-cheat: the agent cannot reach tests/ (overlaid only at verify time), and the checks re-derive outcomes by executing services rather than trusting any file the agent could pre-write. The two files a run must leave behind (declared in artifacts) are additionally guarded against redirection and stubbing: every graded path is rejected if it is a symlink or resolves outside the directory it belongs in (exists/isfile/getsize all follow symlinks, so this is asserted explicitly), the backup marker must record a completed run and the stamped copy beside it must byte-match /opt/webapp/webapp.conf, and both artifacts are snapshotted before the maintenance job runs so a host left with an empty stub or a link pointing elsewhere is caught rather than papered over by the run that would rewrite it. A real run also never writes those basenames anywhere else, so a symlink or an empty stub left under the working directory (`/app`, the image WORKDIR) in place of doing the work is rejected outright — absence there is the pass case, which is what an honest run leaves.
"""

[verifier]
timeout_sec = 300.0

[agent]
# The last benchmarked run finished its hardening correctly but ran out of clock
# during final verification, so the budget is raised to leave room for the audit
# this task requires. Difficulty here comes from what has to be reasoned out, not
# from racing the timer.
timeout_sec = 5400.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 3072
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
