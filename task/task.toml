artifacts = []  # No output file is produced; the graded artifact is the host's on-disk configuration/state.

[task]
name = "dynamo/harden-multiservice-host"
description = "Harden a deliberately mis-configured multi-service Linux host (SSH, Redis, nginx/TLS, sudo/setuid, cron) without breaking its service chain."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Security"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Security hardening"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
task_objective = ["secure_or_harden", "configure", "fix"]
artifact_type = ["configuration_file", "service_or_daemon", "security_artifact"]
expert_time_estimate_hours = 4.0
difficulty_explanation = """
Audience: a security engineer or systems administrator performing a pre-audit hardening pass on a host that has accumulated insecure defaults and a drifted configuration-enforcement job — exactly the remediation work firms pay consultants for before a compliance review or after a pen-test. The environment is synthetic and fully seeded by environment/Dockerfile: it stands up sshd, redis, an nginx TLS reverse proxy in front of a small internal web app that round-trips through redis, and a root maintenance/cron job. The vulnerable live state is produced deterministically by running that maintenance job once at build time. Weaknesses span five layers — authentication (SSH root login and password auth enabled; weak ciphers/MACs/KEX), network exposure (redis effectively bound to 0.0.0.0 with protected-mode off and no password), privilege escalation (a passwordless GTFOBins sudo grant reaching lowuser via the `maintenance` group; a setuid-root helper; a `cap_setuid+ep` file capability on an ops perl copy that `find -perm -4000` never reveals; a group-writable helper script the root job executes; and a leftover uid-0 account `toolsvc`), filesystem permissions (a world-writable root-run maintenance script; world-writable backup output), and transport security (an nginx server block offering non-forward-secret RSA cipher suites). instruction.md states the security properties that must hold and the classes of weakness in scope, but deliberately does not hand over a file-by-file map — locating the effective settings and the specific misconfigurations is part of the task.

Why it is hard, for humans and agents. The central trap defeats the reflexive fix-then-verify-live loop: a root job /opt/ops/maintenance.sh re-applies a host compatibility profile on every run — rewriting the SSH drop-in, the redis local include, the sudoers file, the setuid bit, the file capability, the collector's permissions and the backup permissions — and the verifier runs this job before grading. Worse, the job enforces change control against itself: it compares the active profile (/etc/ops/host-profile.conf) with an approved set of settings hard-coded *inside the job*, and on any mismatch rolls the profile back — to the vendored copy (/usr/share/ops/host-profile.dist) if that copy is itself approved, otherwise by re-rendering the approved settings directly. So the obvious remediation — mirroring secure values across the active profile and the vendored copy — is silently undone too; the approved set in the job has to agree, or the enforcement has to be neutralised outright while the backup keeps working. The tell is brutal for the naive loop: after one run the live config looks hardened while the profile has already been rolled back, and after a second run (the "did my fix survive?" check good agents perform) the live config flips back to insecure. The job also owns /etc/ssh/sshd_config.d and clears any drop-in it did not place, so hardening SSH with a private drop-in instead of through the profile is discarded on the next run. The profile itself is not a checklist: its keys are ops-jargon (access.remote_admin, crypto.suite, tools.operator_privs, paths.shared_mode) and do not map one-to-one onto weaknesses — a single knob covers the sudo grant, the setuid helper and the file capability together — so the vectors have to be confirmed by auditing the host rather than read off a file. Several also hide behind precedence or off the obvious path: the effective SSH policy comes from an Include drop-in; redis.conf's own `bind 127.0.0.1`/`protected-mode yes` are decoys overridden by a last-wins `include /etc/redis/redis.local.conf`; nginx.conf's http-level cipher policy is a decoy overridden by a weak server block in conf.d; the dangerous sudo grant is on the `maintenance` group (grepping for `lowuser` misses it) and targets awk (a trivial root shell); the capability privesc requires `getcap -r /` rather than a setuid scan; the writable-file privesc requires reasoning about which files a root job executes, not just their mode in isolation; the uid-0 backdoor lives in /etc/passwd, not in any service config; and redis must additionally require a password that stays consistent with the app's /opt/webapp/webapp.conf. Grading is all-or-nothing across 17 behavioral checks, so one missed vector or one broken function fails; over-hardening (wiping keys, denying the app, breaking the maintenance backup) fails as surely as under-hardening.
"""
solution_explanation = """
Enumerate the attack surface — sshd effective config via `sshd -T`, redis.conf and its includes, nginx via `nginx -T` (including conf.d), /etc/sudoers.d and group membership, setuid binaries, file capabilities via `getcap -r /`, /etc/passwd for rogue uid-0 accounts, and crucially the maintenance job /opt/ops/maintenance.sh and everything it drives (the active profile, the vendored copy, the approved set inside the job, the SSH drop-in directory it owns, and the collector it executes) — then apply the minimal correct fix, keeping the service chain working.

Key insight: because the verifier runs the maintenance job before grading and the job enforces change control against a set of approved settings hard-coded inside itself, fixing the enforced settings means correcting the whole enforcement chain, not just the profile — and not just the profile plus the vendored copy, which the job also validates. Write secure settings to /etc/ops/host-profile.conf AND the vendored /usr/share/ops/host-profile.dist, and edit the APPROVED block in /opt/ops/maintenance.sh to the same sorted key=value set so the rollback never fires: access.remote_admin=restricted, access.credential_policy=keys-only, crypto.suite=modern, cache.listener=loopback, tools.operator_privs=standard, paths.shared_mode=strict. Then run the job so the good profile is applied. (Cutting the change-control block out of the job, leaving the backup intact, is an equally valid neutralisation.) The job only ever *adds* the setuid bit and the capability (never removes them), so also strip the live setuid bit on /usr/local/bin/netdiag and clear the live capability with `setcap -r /usr/local/bin/opsperl`. Separately fix the vectors the job does not manage: add requirepass to redis.conf and mirror it in /opt/webapp/webapp.conf so the app still authenticates; restrict the nginx conf.d server block's ssl_ciphers to forward-secret ECDHE+AEAD suites; remove the uid-0 account (`userdel -f toolsvc`, since plain userdel refuses while uid 0 is in use); make the world-writable maintenance script root-owned and non-writable by others; and make the collector /opt/ops/collect-logs.sh root-owned and not writable by the maintenance group. The reference solution (solution/solve.py) does exactly this. A qualified expert needs roughly 4 hours, most of it discovering that the enforcement validates its own inputs, working out which knob drives which vector, and verifying no fix regresses the chain.
"""
verification_explanation = """
The verifier (tests/test_outputs.py) first runs /opt/ops/maintenance.sh exactly as the scheduler would (an autouse fixture), then boots sshd, redis, nginx and the web app from their on-disk configuration and grades behaviorally; reward is 1 only if all 17 checks pass. Running the job first is deliberate and is what makes live-only fixes — and profile-only, and profile-plus-vendored-copy fixes — fail, because the job's change control rolls the profile back unless the approved set inside the job agrees or the enforcement was neutralised. Nothing is compared to a stored constant, so there is no tolerance to calibrate — each check is an exact behavioral pass/fail.

Hardening checks (each attack must fail after the job has run): PermitRootLogin/PasswordAuthentication are read from `sshd -T` effective output (defeats the Include drop-in and the re-enforcement); a weak-primitive denylist must not appear in the effective Ciphers/MACs/KexAlgorithms; an unauthenticated RESP PING to redis on loopback and on the container's public IP must be refused (NOAUTH or connection refused, catching the last-wins include); `lowuser` running `sudo -n awk 'BEGIN{system("id")}'` must not yield uid=0 (catches the group-based grant); the setuid helper run as lowuser must report a non-zero euid; running `/usr/local/bin/opsperl` as lowuser to set uid 0 must not yield uid=0(root) (catches the cap_setuid file capability, which a setuid scan misses); lowuser overwriting the collector /opt/ops/collect-logs.sh and then invoking the root maintenance job must not execute the planted payload as root (catches a group-writable file the root job runs; state is restored afterward); /etc/passwd must contain no non-root uid-0 account; an openssl s_client handshake restricted to non-PFS ciphers must fail (catches the conf.d override); the maintenance script and crontab must be root-owned and not group/other-writable; and after running the job, nothing under /var/backups/app may be world-writable.

Functionality checks (none may regress): key-based SSH login as appuser runs a command (the private key ships only in tests/keys, never in the image); `GET https://127.0.0.1/status` through nginx returns JSON with cache=healthy (proves redis auth is consistent with the app and TLS/proxy work); a modern TLS 1.2 handshake still completes; and the maintenance job still writes its backup — the backup marker is cleared before that run, so a stale file from an earlier run cannot stand in for the work and gutting the job into a no-op fails. Because these execute the real service chain, the "wipe/deny everything" shortcut fails — closing a vector by breaking its service regresses a functionality check. Where removing the vulnerable object outright genuinely closes a vector (deleting the setuid helper, the collector, the crontab), that is accepted: the collector check still attempts the plant so a deleted-but-recreatable helper is caught. Grading targets the persistent artifact (the host's configuration and file state), evaluated after enforcement, not ephemeral runtime tweaks. Anti-cheat: the agent cannot reach tests/ (overlaid only at verify time), and the checks re-derive outcomes by executing services rather than trusting any file the agent could pre-write.
"""

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 3072
storage_mb = 10240
