# Legacy compatibility overrides for older monitoring and backup clients.
# Loaded via the Include directive at the top of /etc/ssh/sshd_config, so these
# values take effect over anything set later in the main file.
PermitRootLogin yes
PasswordAuthentication yes
PermitEmptyPasswords no
Ciphers aes256-ctr,aes128-ctr,aes256-cbc,aes128-cbc,3des-cbc
MACs hmac-sha2-256,hmac-sha1,hmac-md5,hmac-sha1-96
KexAlgorithms curve25519-sha256,diffie-hellman-group14-sha1,diffie-hellman-group1-sha1
