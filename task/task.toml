artifacts = []  # No output file is produced; the graded artifact is the host's on-disk configuration/state.

[task]
name = "dynamo/harden-multiservice-host"
description = "Harden a deliberately mis-configured multi-service Linux host (SSH, Redis, nginx/TLS, sudo/setuid, cron) without breaking its service chain."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Security"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Security hardening"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
task_objective = ["secure_or_harden", "configure", "fix"]
artifact_type = ["configuration_file", "service_or_daemon", "security_artifact"]
expert_time_estimate_hours = 4.0
difficulty_explanation = """
Audience: a security engineer or systems administrator performing a pre-audit hardening pass on a host that has accumulated insecure defaults and a drifted configuration-enforcement job — exactly the remediation work firms pay consultants for before a compliance review or after a pen-test. The environment is synthetic and fully seeded by environment/Dockerfile: it stands up sshd, redis, an nginx TLS reverse proxy in front of a small internal web app that round-trips through redis, and a root maintenance/cron job. The vulnerable live state is produced deterministically by running that maintenance job once at build time. Weaknesses span five layers — authentication (SSH root login and password auth enabled; weak ciphers/MACs/KEX), network exposure (redis effectively bound to 0.0.0.0 with protected-mode off and no password), privilege escalation (a passwordless GTFOBins sudo grant reaching lowuser via the `maintenance` group + a setuid-root helper + a leftover uid-0 account `toolsvc`), filesystem permissions (a world-writable root-run maintenance script; world-writable backup output), and transport security (an nginx server block offering non-forward-secret RSA cipher suites).

Why it is hard, for humans and agents. The central trap defeats the reflexive fix-then-verify-live loop: a root job /opt/ops/maintenance.sh re-applies an insecure baseline (/opt/ops/baseline.env) on every run — rewriting the SSH drop-in, the redis local include, the sudoers file, the setuid bit and the backup permissions — and the verifier runs this job before grading. An agent who hardens only the live configuration has every change silently reverted and fails; the fix must correct the baseline (or neutralise the enforcement) while preserving the backup. Several vectors also hide behind precedence or off the obvious path: the effective SSH policy comes from an Include drop-in; redis.conf's own `bind 127.0.0.1`/`protected-mode yes` are decoys overridden by a last-wins `include /etc/redis/redis.local.conf`; nginx.conf's http-level cipher policy is a decoy overridden by a weak server block in conf.d; the dangerous sudo grant is on the `maintenance` group (grepping for `lowuser` misses it) and targets awk (a trivial root shell); the uid-0 backdoor lives in /etc/passwd, not in any service config; and redis must additionally require a password that stays consistent with the app's /opt/webapp/webapp.conf. Grading is all-or-nothing across 15 behavioral checks, so one missed vector or one broken function fails; over-hardening (wiping keys, denying the app, breaking the maintenance backup) fails as surely as under-hardening.
"""
solution_explanation = """
Enumerate the attack surface — sshd effective config via `sshd -T`, redis.conf and its includes, nginx via `nginx -T` (including conf.d), /etc/sudoers.d and group membership, setuid binaries, /etc/passwd for rogue uid-0 accounts, and crucially /opt/ops/maintenance.sh + /opt/ops/baseline.env — then apply the minimal correct fix, keeping the service chain working.

Key insight: because the verifier runs the maintenance job before grading, fixes to the enforced settings must land in the baseline (or the enforcement must be removed). Correct /opt/ops/baseline.env to secure values — SSH_PERMIT_ROOT=no, SSH_PASSWORD_AUTH=no, modern SSH_CIPHERS/SSH_MACS, REDIS_BIND=127.0.0.1, REDIS_PROTECTED_MODE=yes, SUDO_GRANT empty, NETDIAG_SETUID=no, BACKUP_MODE=0750 — then run the job so the good baseline is applied (it only ever *adds* the setuid bit, so also strip the live bit on /usr/local/bin/netdiag). Separately fix the vectors the job does not manage: add requirepass to redis.conf and mirror it in /opt/webapp/webapp.conf so the app still authenticates; restrict the nginx conf.d server block's ssl_ciphers to forward-secret ECDHE+AEAD suites; remove the uid-0 account (`userdel -f toolsvc`, since plain userdel refuses while uid 0 is in use); and make the world-writable maintenance script root-owned and non-writable by others. The reference solution (solution/solve.py) does exactly this. A qualified expert needs roughly 4 hours, most of it discovering the enforcement drift and verifying no fix regresses the chain.
"""
verification_explanation = """
The verifier (tests/test_outputs.py) first runs /opt/ops/maintenance.sh exactly as the scheduler would (an autouse fixture), then boots sshd, redis, nginx and the web app from their on-disk configuration and grades behaviorally; reward is 1 only if all 15 checks pass. Running the job first is deliberate and is what makes live-only fixes fail. Nothing is compared to a stored constant, so there is no tolerance to calibrate — each check is an exact behavioral pass/fail.

Hardening checks (each attack must fail after the job has run): PermitRootLogin/PasswordAuthentication are read from `sshd -T` effective output (defeats the Include drop-in and the re-enforcement); a weak-primitive denylist must not appear in the effective Ciphers/MACs/KexAlgorithms; an unauthenticated RESP PING to redis on loopback and on the container's public IP must be refused (NOAUTH or connection refused, catching the last-wins include); `lowuser` running `sudo -n awk 'BEGIN{system("id")}'` must not yield uid=0 (catches the group-based grant); the setuid helper run as lowuser must report a non-zero euid; /etc/passwd must contain no non-root uid-0 account; an openssl s_client handshake restricted to non-PFS ciphers must fail (catches the conf.d override); the maintenance script and crontab must be root-owned and not group/other-writable; and after running the job, nothing under /var/backups/app may be world-writable.

Functionality checks (none may regress): key-based SSH login as appuser runs a command (the private key ships only in tests/keys, never in the image); `GET https://127.0.0.1/status` through nginx returns JSON with cache=healthy (proves redis auth is consistent with the app and TLS/proxy work); a modern TLS 1.2 handshake still completes; and the maintenance job still writes its backup. Because these execute the real service chain, the "wipe/deny everything" shortcut fails — closing a vector by breaking its service regresses a functionality check. Grading targets the persistent artifact (the host's configuration and file state), evaluated after enforcement, not ephemeral runtime tweaks. Anti-cheat: the agent cannot reach tests/ (overlaid only at verify time), and the checks re-derive outcomes by executing services rather than trusting any file the agent could pre-write.
"""

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 3072
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
