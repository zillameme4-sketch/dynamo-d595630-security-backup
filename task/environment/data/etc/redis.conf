# Redis configuration for the app cache.
port 6379
bind 127.0.0.1 -::1
protected-mode yes
daemonize no
loglevel notice
logfile ""
dir /var/lib/redis
save ""
appendonly no
# requirepass is intentionally unset in this build.

# Local, host-specific overrides are applied last (so they take precedence).
include /etc/redis/redis.local.conf
